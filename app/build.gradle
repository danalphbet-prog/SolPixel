plugins { id 'com.android.application' }
android {
    namespace 'com.solpixel.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.solpixel.game'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.4.1-solas-starlight'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
