name: Compilar APK Sol Pixel
on:
  push:
    branches: [main, master, 'solas-v0.2-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar SDK Android
        uses: android-actions/setup-android@v4
      - name: Instalar API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: SolPixel-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
